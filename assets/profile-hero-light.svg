      <circle cx="25" cy="26" r="5" fill="#007b73"/>
      <text x="44" y="32" fill="#486772" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="2">ENGINEERING STACK</text>
      <path d="M41 90v191" stroke="#007b73" stroke-opacity=".5" stroke-width="2"/>
      <circle cx="41" cy="91" r="6" fill="#007b73"/>
      <circle cx="41" cy="155" r="6" fill="#007b73"/>
      <circle cx="41" cy="219" r="6" fill="#007b73"/>
      <circle cx="41" cy="283" r="6" fill="#007b73"/>
      <path d="M58 91h22M58 155h22M58 219h22M58 283h22" stroke="#007b73" stroke-opacity=".6" stroke-width="2"/>
      <rect x="80" y="69" width="305" height="44" rx="7" fill="#e9f2f1" stroke="#9cbabd"/>
