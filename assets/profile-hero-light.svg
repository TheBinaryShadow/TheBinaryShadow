<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">The Binary Shadow</title>
  <desc id="desc">Light profile banner for Robert L. with an abstract engineering stack.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6faf9"/>
      <stop offset="0.58" stop-color="#eaf2f2"/>
      <stop offset="1" stop-color="#edf5f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007b73"/>
      <stop offset="1" stop-color="#257d98"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38616a" stroke-opacity=".10"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1600" height="420" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="420" fill="url(#background)"/>
    <rect width="1600" height="420" fill="url(#grid)"/>
    <circle cx="1470" cy="350" r="340" fill="#007b73" fill-opacity=".04"/>
    <path d="M0 0h8v420H0z" fill="url(#accent)"/>
    <path d="M74 45h48M74 45v25M999 45h26M999 45v25M74 375h48M74 375v-25M999 375h26M999 375v-25" fill="none" stroke="#007b73" stroke-opacity=".55" stroke-width="2"/>

    <text x="82" y="94" fill="#007b73" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" letter-spacing="4">ROBERT L.  /  SYSTEMS AND SECURITY</text>
    <text x="78" y="202" fill="#132a33" font-family="Arial, Helvetica, sans-serif" font-size="77" font-weight="700" letter-spacing="1">THE BINARY SHADOW</text>
    <rect x="83" y="231" width="73" height="4" rx="2" fill="url(#accent)"/>
    <text x="82" y="283" fill="#294952" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" letter-spacing="2">NETWORKING  /  INFRASTRUCTURE  /  APPLIED RESEARCH</text>
    <text x="82" y="345" fill="#486772" font-family="Consolas, Menlo, monospace" font-size="18" letter-spacing="2">FROM PACKETS TO PLATFORMS</text>

    <g transform="translate(1092 45)">
