      <rect x="80" y="197" width="305" height="44" rx="7" fill="#e9f2f1" stroke="#9cbabd"/>
      <rect x="80" y="261" width="305" height="44" rx="7" fill="#e9f2f1" stroke="#9cbabd"/>
      <text x="100" y="98" fill="#1c3d45" font-family="Consolas, Menlo, monospace" font-size="17" letter-spacing="2">01  PACKETS</text>
      <text x="100" y="162" fill="#1c3d45" font-family="Consolas, Menlo, monospace" font-size="17" letter-spacing="2">02  PROTOCOLS</text>
      <text x="100" y="226" fill="#1c3d45" font-family="Consolas, Menlo, monospace" font-size="17" letter-spacing="2">03  SYSTEMS</text>
      <text x="100" y="290" fill="#1c3d45" font-family="Consolas, Menlo, monospace" font-size="17" letter-spacing="2">04  TRUST</text>
